<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCo</title>

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet">

    <link href="https://db.onlinewebfonts.com/c/f1fcc5aed1e20fc0cdb9f8a7573625bd?family=Integral+CF+Regular"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Offerbar -->
    <section class="offer-bar">
        <div class="offer-space"></div>

        <div class="offer-text satoshi">
            <p>
                Sign up and get 20% off to your first order.
            </p>
            <a href="#">
                Sign up now
            </a>
        </div>

        <div class="offer-close">
            <img src="Icons/cross.svg" alt="">
        </div>
    </section>

    <nav class="nav-bar">

        <div>
            <img src="Icons/menu.svg" alt="">
        </div>

        <div class="integral-cf">
            <p>
                SHOP.CO
            </p>
        </div>

        <div class="satoshi">
            <ul>
                <li>Shop</li>
                <li>On Sale</li>
                <li>New Arrivals</li>
                <li>Brands</li>
            </ul>
        </div>

        <div class="search-bar">
            <form action="">
                <img src="Icons/serach.svg" alt="">
                <input type="text" placeholder="Serach for products...">
            </form>
        </div>

        <div>
            <img src="Icons/cart.svg" alt="">
            <img src="Icons/profile.svg" alt="">
        </div>
    </nav>


</body>

</html>
