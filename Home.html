<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopCo</title>

    <!-- Fonts -->
    <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Offerbar -->
    <section class="offer-bar d-flex   bg-black text-white align-items-center text-nowrap ">
        <div class="d-none d-md-block">
        </div>
        <div class="d-flex satoshi fw-normal" style="margin-top: 9px; margin-bottom: 10px; font-size: 14px;">
            <p class="mb-0 text-white">
                Sign up and get 20% off to your first order.
            </p>
            <a class="nav-underline text-white" href="#">
                Sign up now
            </a>
        </div>
        <div class="d-flex d-inline-block d-none d-md-block">
            <img  src="Icons/cross.svg" alt="" style="height: 20px; width: 20px;">
        </div>
    </section>



    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>

</body>

</html>
